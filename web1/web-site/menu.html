<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню Ресторана - LUMINA ESTERIA GRAND HOTEL</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e67e22;
            --accent-color: #d35400;
            --background-color: #f8f9fa;
            --text-color: #2c3e50;
            --text-light: #6c757d;
            --white: #ffffff;
            --gold: #d4af37;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-secondary: linear-gradient(135deg, #e67e22, #d35400);
            --gradient-gold: linear-gradient(135deg, #d4af37, #f7ef8a);
            --shadow-sm: 0 2px 20px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 40px rgba(0,0,0,0.12);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --border-radius: 16px;
            --border-radius-lg: 24px;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-color);
            line-height: 1.8;
            min-height: 100vh;
            padding: 40px 20px;
            font-weight: 400;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Top Bar для страницы */
        .top-bar {
            background: var(--primary-color);
            color: var(--white);
            padding: 8px 0;
            font-size: 13px;
            position: relative;
            z-index: 1001;
            font-weight: 500;
            margin-bottom: 20px;
            border-radius: var(--border-radius);
        }

        .contact-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .phone {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .phone::before {
            content: "📞";
            font-size: 14px;
        }

        .language-switcher {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .language-btn {
            background: transparent;
            border: none;
            color: var(--white);
            padding: 6px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
            font-weight: 500;
            font-size: 12px;
        }

        .language-btn.active {
            background: var(--gold);
            box-shadow: var(--shadow-sm);
            color: var(--primary-color);
        }

        .language-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 25px;
            color: var(--text-color);
            font-weight: 400;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }

        .header h1::after {
            content: "";
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: var(--gradient-gold);
            border-radius: 2px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 40px;
            color: var(--text-light);
            font-weight: 300;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 25px;
            background: rgba(255, 255, 255, 0.7);
            padding: 25px;
            border-radius: var(--border-radius-lg);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: var(--shadow-md);
        }

        .search-box {
            display: flex;
            gap: 15px;
            flex: 1;
            min-width: 350px;
        }

        .search-input {
            flex: 1;
            padding: 16px 25px;
            border: 2px solid #e8e8e8;
            border-radius: var(--border-radius);
            background: var(--white);
            color: var(--text-color);
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
        }

        .search-input::placeholder {
            color: var(--text-light);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        /* Category Filter */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid #e8e8e8;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(15px);
        }

        .category-btn.active {
            background: var(--gradient-gold);
            color: var(--primary-color);
            border-color: var(--gold);
            box-shadow: var(--shadow-sm);
        }

        .category-btn:hover:not(.active) {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* Buttons */
        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .search-btn {
            background: var(--gradient-gold);
            color: var(--primary-color);
            box-shadow: var(--shadow-md);
        }

        .search-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        .back-btn {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: var(--shadow-md);
        }

        .back-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: var(--shadow-lg);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.7);
            border-radius: var(--border-radius-lg);
            padding: 35px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--gradient-gold);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .menu-item:hover::before {
            transform: scaleX(1);
        }

        .menu-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: var(--shadow-lg);
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .item-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            flex: 1;
            margin-right: 20px;
        }

        .item-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-color);
            background: var(--gradient-gold);
            padding: 10px 20px;
            border-radius: 50px;
            white-space: nowrap;
            box-shadow: var(--shadow-sm);
        }

        .item-description {
            color: var(--text-light);
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 15px;
            font-weight: 300;
        }

        .item-ingredients {
            color: var(--text-light);
            font-size: 0.9rem;
            font-style: italic;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            padding-top: 15px;
            font-weight: 300;
        }

        .item-weight {
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 10px;
        }

        /* Loading and Messages */
        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 1.2rem;
            color: var(--text-light);
            grid-column: 1 / -1;
        }

        .error {
            text-align: center;
            padding: 60px 40px;
            font-size: 1.2rem;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            border-radius: var(--border-radius);
            margin: 20px 0;
            grid-column: 1 / -1;
        }

        .empty {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-light);
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        .stats {
            color: var(--text-light);
            font-size: 1rem;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .item-header {
                flex-direction: column;
                gap: 15px;
            }

            .item-price {
                align-self: flex-start;
            }
            
            body {
                padding: 20px 15px;
            }
            
            .header {
                margin-bottom: 40px;
            }

            .category-filter {
                gap: 10px;
            }

            .category-btn {
                padding: 10px 20px;
                font-size: 14px;
            }

            .contact-info {
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 0 20px;
            }
        }

        /* Плавная прокрутка */
        html {
            scroll-behavior: smooth;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--background-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Language Notification */
        .language-notification {
            position: fixed;
            top: 120px;
            right: 40px;
            background: var(--primary-color);
            color: var(--white);
            padding: 25px 30px;
            border-radius: var(--border-radius);
            z-index: 1003;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            opacity: 0;
            transform: translateX(100px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
        }

        .language-notification.show {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Top Bar с переключателем языка -->
        <div class="top-bar">
            <div class="contact-info">
                <div class="phone">+375(29)-131-68-19</div>
                <div class="language-switcher">
                    <button class="language-btn active" data-lang="ru">RU</button>
                    <button class="language-btn" data-lang="en">EN</button>
                </div>
            </div>
        </div>

        <div class="header">
            <h1 data-ru="🍽️ МЕНЮ РЕСТОРАНА" data-en="🍽️ RESTAURANT MENU">🍽️ МЕНЮ РЕСТОРАНА</h1>
            <p data-ru="Изысканные блюда международной кухни от наших шеф-поваров" data-en="Exquisite international cuisine dishes from our chefs">Изысканные блюда международной кухни от наших шеф-поваров</p>

            <!-- Панель управления -->
            <div class="control-panel">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input"
                        placeholder="Поиск по названию или ингредиентам..."
                        data-ru="Поиск по названию или ингредиентам..."
                        data-en="Search by name or ingredients...">
                    <button id="searchBtn" class="btn search-btn" data-ru="🔍 Поиск" data-en="🔍 Search">🔍 Поиск</button>
                </div>
                <button onclick="window.history.back()" class="btn back-btn" data-ru="← Назад" data-en="← Back">← Назад</button>
            </div>

            <!-- Фильтр по категориям -->
            <div class="category-filter">
                <button class="category-btn active" data-category="all" data-ru="Все блюда" data-en="All dishes">Все блюда</button>
                <button class="category-btn" data-category="starters" data-ru="Закуски" data-en="Starters">Закуски</button>
                <button class="category-btn" data-category="soups" data-ru="Супы" data-en="Soups">Супы</button>
                <button class="category-btn" data-category="main" data-ru="Основные блюда" data-en="Main courses">Основные блюда</button>
                <button class="category-btn" data-category="desserts" data-ru="Десерты" data-en="Desserts">Десерты</button>
                <button class="category-btn" data-category="drinks" data-ru="Напитки" data-en="Drinks">Напитки</button>
            </div>

            <div class="stats" id="stats">Загрузка...</div>
        </div>

        <!-- Контейнер для блюд -->
        <div id="dishesContainer" class="menu-grid">
            <div class="loading">Загрузка меню...</div>
        </div>
    </div>

    <script>
        // Основные переменные
        let allDishes = [];
        const API_BASE = 'http://localhost:3000';
        let currentCategory = 'all';

        // Функция для загрузки блюд
        async function loadDishes(searchTerm = '', category = 'all') {
            const container = document.getElementById('dishesContainer');
            const stats = document.getElementById('stats');

            try {
                container.innerHTML = '<div class="loading">Загрузка меню...</div>';

                let url = `${API_BASE}/api/dishes`;
                const params = new URLSearchParams();
                
                if (searchTerm) {
                    params.append('q', searchTerm);
                }
                if (category && category !== 'all') {
                    params.append('category', category);
                }
                
                if (params.toString()) {
                    url += `?${params.toString()}`;
                }

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }

                const dishes = await response.json();
                allDishes = dishes;
                displayDishes(dishes);

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                container.innerHTML = `
                    <div class="error">
                        ❌ Ошибка загрузки данных: ${error.message}
                        <br><br>
                        <button onclick="loadDishes()" class="btn search-btn">Попробовать снова</button>
                    </div>
                `;
                stats.textContent = 'Ошибка загрузки';
            }
        }

        // Функция для отображения блюд
        function displayDishes(dishes) {
            const container = document.getElementById('dishesContainer');
            const stats = document.getElementById('stats');

            if (!dishes || dishes.length === 0) {
                container.innerHTML = `
                    <div class="empty">
                        🍽️ Блюда не найдены
                        <br>
                        <small>Попробуйте изменить поисковый запрос или категорию</small>
                    </div>
                `;
                stats.textContent = 'Найдено: 0 блюд';
                return;
            }

            let html = '';

            dishes.forEach(dish => {
                html += `
                    <div class="menu-item" data-category="${dish.category || 'other'}">
                        <div class="item-header">
                            <div class="item-name">${escapeHtml(dish.name)}</div>
                            <div class="item-price">${formatPrice(dish.price)}</div>
                        </div>
                        <div class="item-description">
                            ${escapeHtml(dish.description || 'Описание отсутствует')}
                        </div>
                        <div class="item-ingredients">
                            📋 Ингредиенты: ${escapeHtml(dish.ingredients || 'Не указаны')}
                        </div>
                        ${dish.weight ? `<div class="item-weight">⚖️ Вес: ${escapeHtml(dish.weight)}</div>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
            stats.textContent = `Найдено: ${dishes.length} блюд`;
        }

        // Функция для поиска
        function searchDishes() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.trim();
            loadDishes(searchTerm, currentCategory);
        }

        // Функция для смены категории
        function changeCategory(category) {
            currentCategory = category;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-category') === category) {
                    btn.classList.add('active');
                }
            });
            
            loadDishes(document.getElementById('searchInput').value.trim(), category);
        }

        // Функция для форматирования цены в белорусских рублях
        function formatPrice(price) {
            if (!price) return '0 Byn';
            return `${parseFloat(price).toFixed(2)} Byn`;
        }

        // Функция для экранирования HTML
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Класс для управления переключением языка
        class LanguageSwitcher {
            constructor() {
                this.currentLang = 'ru';
                this.currentNotification = null;
                this.init();
            }

            init() {
                // Обработчики для кнопок перевода
                document.querySelectorAll('.language-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const lang = e.target.dataset.lang;
                        this.switchLanguage(lang);
                    });
                });

                // Загружаем сохраненный язык из localStorage
                const savedLang = localStorage.getItem('hotelLang');
                if (savedLang && savedLang !== 'ru') {
                    this.switchLanguage(savedLang);
                }
            }

            switchLanguage(lang) {
                if (this.currentLang === lang) return;

                // Удаляем предыдущее уведомление, если оно есть
                this.removeCurrentNotification();

                this.currentLang = lang;

                // Обновляем активную кнопку
                document.querySelectorAll('.language-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });

                // Обновляем все элементы с атрибутами data-ru и data-en
                document.querySelectorAll('[data-ru]').forEach(element => {
                    if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                        element.placeholder = element.getAttribute(`data-${lang}`);
                    } else {
                        element.textContent = element.getAttribute(`data-${lang}`);
                    }
                });

                // Обновляем атрибут lang у html
                document.documentElement.lang = lang;

                // Сохраняем выбор в localStorage
                localStorage.setItem('hotelLang', lang);

                // Показываем уведомление о смене языка
                this.showLanguageNotification(lang);
            }

            removeCurrentNotification() {
                if (this.currentNotification) {
                    this.currentNotification.remove();
                    this.currentNotification = null;
                }
            }

            showLanguageNotification(lang) {
                // Создаем уведомление
                const notification = document.createElement('div');
                notification.className = 'language-notification show';
                notification.textContent = lang === 'ru'
                    ? 'Язык изменен на русский'
                    : 'Language switched to English';

                document.body.appendChild(notification);
                this.currentNotification = notification;

                // Удаляем уведомление через 2 секунды
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        if (notification.parentNode) {
                            notification.parentNode.removeChild(notification);
                        }
                        if (this.currentNotification === notification) {
                            this.currentNotification = null;
                        }
                    }, 300);
                }, 2000);
            }
        }

        // Обработчики событий
        document.addEventListener('DOMContentLoaded', function () {
            // Загружаем блюда при запуске
            loadDishes();

            // Поиск при нажатии Enter
            document.getElementById('searchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    searchDishes();
                }
            });

            // Поиск при клике на кнопку
            document.getElementById('searchBtn').addEventListener('click', searchDishes);

            // Сброс поиска при очистке поля
            document.getElementById('searchInput').addEventListener('input', function (e) {
                if (e.target.value === '') {
                    loadDishes('', currentCategory);
                }
            });

            // Обработчики для кнопок категорий
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    changeCategory(this.getAttribute('data-category'));
                });
            });

            // Инициализируем переключатель языка
            new LanguageSwitcher();
        });

        // Автообновление каждые 30 секунд
        setInterval(() => loadDishes(document.getElementById('searchInput').value.trim(), currentCategory), 30000);
    </script>
</body>

</html>
